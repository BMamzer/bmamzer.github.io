<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Powerhaven - get the game</title>
  <meta name="description" content="Powerhaven: quick rifts, epic loot and a haven to build. A bright, fast action RPG for Android and iOS." />
  <meta name="robots" content="noindex" />
  <!-- The show-off cards' links land here (docs/social-currency.md 5.2): ?c=<card> is the campaign tag (Play's utm_campaign,
       the App Store's ct), ?g=<day>&t=<tier>&n=<name> a Gauntlet challenge (the name checked against the game's name words in
       ../build/data.js), ?c=blueprint&n=<name>#<code> a haven blueprint (the layout after the #, which never reaches the server;
       an installed game opens the link itself). Phones go on to their store; nothing about the player is
       in the link. -->
  <style>
    :root { --bg: #24166a; --panel: #3b2aa0; --text: #ffffff; --muted: #c8bff5; --yellow: #ffcf2b; --edge: #c27c00; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 30%, #3b2aa0, #160c46 70%); color: var(--text);
           font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
    main { max-width: 560px; margin: 0 auto; padding: 48px 20px 40px; }
    h1 { font-size: 2.6rem; margin: 0 0 6px; letter-spacing: 1px; }
    .tagline { color: var(--muted); margin: 0 0 28px; }
    .challenge { background: rgba(0,0,0,0.35); border-radius: 18px; padding: 18px; margin: 0 0 28px; display: none; }
    .challenge b { color: var(--yellow); font-size: 1.6rem; display: block; }
    .btn { display: block; margin: 14px auto; max-width: 340px; padding: 16px 20px; border-radius: 18px; font-weight: 700; font-size: 1.15rem;
           text-decoration: none; color: #24133f; background: var(--yellow); border-bottom: 6px solid var(--edge); }
    .btn.alt { background: #2f86ff; color: #fff; border-bottom-color: #1450b8; }
    .small { color: var(--muted); font-size: 0.9rem; margin-top: 30px; }
    .small a { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>POWERHAVEN</h1>
  <p class="tagline">Quick rifts, epic loot and a haven to build. Free on Android and iOS, no ads.</p>
  <div class="challenge" id="challenge"><b id="challengeTier"></b><span id="challengeText"></span></div>
  <a class="btn" id="play" href="#">Get it on Google Play</a>
  <a class="btn alt" id="ios" href="#">Download on the App Store</a>
  <p class="small"><a href="/powerhaven/">About Powerhaven</a> · <a href="/powerhaven/policy/">Privacy Policy</a></p>
</main>
<script src="../build/data.js"></script>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var card = (q.get('c') || 'link').replace(/[^a-z0-9_-]/gi, '').slice(0, 24) || 'link';
    var campaign = 'card_' + card;
    var play = 'https://play.google.com/store/apps/details?id=bartmamzer.powerhaven.game&referrer=' +
      encodeURIComponent('utm_source=powerhaven&utm_medium=share&utm_campaign=' + campaign);
    var ios = 'https://apps.apple.com/app/id6820693104?pt=117938829&ct=' + encodeURIComponent(campaign) + '&mt=8';
    document.getElementById('play').href = play;
    document.getElementById('ios').href = ios;
    // a Gauntlet challenge: everyone plays the same run each day
    var day = parseInt(q.get('g') || '', 10), tier = parseInt(q.get('t') || '', 10);
    var challenge = day > 0 && tier > 0 && tier <= 1000;
    // a haven blueprint: the game opens these links itself; without it, say what it is before the store
    var blueprint = card === 'blueprint' && location.hash.length > 8;
    if (blueprint) {
      var bwho = 'A friend', bname = q.get('n') || '', bwords = (window.PH_BUILD_DATA || {}).nameWords, bm = /^([A-Z][a-z]+)([A-Z][a-z]+)(\d{2})$/.exec(bname);
      if (bm && bwords && bwords.adjectives.indexOf(bm[1]) >= 0 && bwords.nouns.indexOf(bm[2]) >= 0) bwho = bname;
      document.getElementById('challenge').style.display = 'block';
      document.getElementById('challengeTier').textContent = bwho === 'A friend' ? 'A haven blueprint' : bwho + '\'s haven';
      document.getElementById('challengeText').textContent = bwho + ' shared their haven with you. Get Powerhaven, then tap the link again to walk through it and copy it into your own haven.';
    }
    if (challenge) {
      // the challenger's generated name, shown only when the game could have made it (two of its words, two digits)
      var who = 'A friend', name = q.get('n') || '', words = (window.PH_BUILD_DATA || {}).nameWords, m = /^([A-Z][a-z]+)([A-Z][a-z]+)(\d{2})$/.exec(name);
      if (m && words && words.adjectives.indexOf(m[1]) >= 0 && words.nouns.indexOf(m[2]) >= 0) who = name;
      document.getElementById('challenge').style.display = 'block';
      document.getElementById('challengeTier').textContent = 'Gauntlet #' + day + ': tier ' + tier;
      document.getElementById('challengeText').textContent = who + ' reached tier ' + tier + ' in the day\'s Gauntlet. Everyone plays the same run that day. Can you go deeper?';
    }
    var ua = navigator.userAgent || '';
    var android = /Android/i.test(ua), apple = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (android) document.getElementById('ios').style.display = 'none';
    if (apple) document.getElementById('play').style.display = 'none';
    // phones go straight on to their store (after a moment when there is a challenge to read)
    var go = android ? play : apple ? ios : null;
    if (go) setTimeout(function () { location.href = go; }, challenge || blueprint ? 3500 : 300);
  })();
</script>
</body>
</html>
